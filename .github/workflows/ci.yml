name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad, seguridad y tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Crear venv e instalar dependencias
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Ruff (lint, PEP8)
        run: . .venv/bin/activate && ruff check .

      - name: Black (formato)
        run: . .venv/bin/activate && black --check .

      - name: Mypy
        run: . .venv/bin/activate && mypy src

      - name: Pyright
        run: . .venv/bin/activate && pyright src

      - name: Bandit (seguridad)
        run: . .venv/bin/activate && bandit -r src

      - name: Pytest con cobertura minima 85%
        run: . .venv/bin/activate && pytest --cov=src --cov-report=term-missing