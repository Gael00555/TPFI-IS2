[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "singleton_proxy_observer"
version = "0.1.0"
description = "."
readme = "README.md"
authors = [
  {name = "Gael Gabriel Guiffrey", email = "gaelguiffrey9@gmail.com"}
]
maintainers = [
  {name = "Gael Gabriel Guiffrey", email = "gaelguiffrey9@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "boto3",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "security" },
]
lint = [
    "ruff",
    "black",
]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
]
typecheck = [
    "mypy",
    "pyright",
]
security = [
    "bandit",
]
docs = [
    "pdoc",
]

[project.urls]
bugs = "https://github.com/Gael00555/singleton_proxy_observer/issues"
changelog = "https://github.com/Gael00555/singleton_proxy_observer/releases"
documentation = "https://Gael00555.github.io/singleton_proxy_observer/"
homepage = "https://github.com/Gael00555/singleton_proxy_observer"



[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\:",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/spo_core"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
